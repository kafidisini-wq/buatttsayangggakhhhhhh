<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #ffb6c1; /* Pink lembut */
    font-family: 'Arial', sans-serif;
    overflow-x: hidden;
  }

  /* --- SECTION 1: KOTAK KEJUTAN --- */
  .section-1 {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  #gift-box {
    width: 150px;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10;
  }
  #gift-box:active {
    transform: scale(0.9);
  }
  .particle {
    position: absolute;
    width: 60px; 
    pointer-events: none;
    animation: popUp 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    z-index: 5;
  }
  @keyframes popUp {
    0% { transform: translate(0, 0) scale(0.2); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }

  /* --- SECTION 2: TEKS UTAMA --- */
  .section-2 {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  .teks-sayang {
    font-size: 3.5rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px #ff69b4, 0 0 30px #ff1493;
    animation: heartbeat 2s infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* --- SECTION 3: YOUR NAUGHTY PICTURE --- */
  .section-3 {
    padding: 50px 20px 100px 20px;
    text-align: center;
  }
  .gallery-title {
    font-size: 2rem;
    color: #fff;
    margin-bottom: 50px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    font-style: italic;
  }
  .gallery-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .foto-miring {
    width: 80%;
    max-width: 280px;
    aspect-ratio: 9/16; 
    object-fit: cover;
    border: 8px solid white;
    border-radius: 12px;
    box-shadow: 5px 10px 20px rgba(0,0,0,0.3);
    margin-bottom: 40px;
    transition: transform 0.4s ease;
  }
  .foto-miring:hover, .foto-miring:active {
    transform: scale(1.05) rotate(0deg) !important;
    z-index: 20;
    position: relative;
  }
  .foto-1 { transform: rotate(-12deg) translateX(-20px); }
  .foto-2 { transform: rotate(15deg) translateX(25px); }
  .foto-3 { transform: rotate(-8deg) translateX(-10px); }
</style>
</head>
<body>

  <!-- SECTION 1 -->
  <div class="section-1" id="home">
    <img src="https://cdn-icons-png.flaticon.com/512/4213/4213958.png" id="gift-box" alt="Kotak" onclick="bukaKotak()">
  </div>

  <!-- SECTION 2 -->
  <div class="section-2">
    <h1 class="teks-sayang">Kamu segalanya<br>buat aku sayang</h1>
  </div>

  <!-- SECTION 3 -->
  <div class="section-3">
    <h2 class="gallery-title">your naughty picture</h2>
    <div class="gallery-container">
      <img src="foto1.jpg" class="foto-miring foto-1" alt="Pic 1">
      <img src="foto2.jpg" class="foto-miring foto-2" alt="Pic 2">
      <img src="foto3.jpg" class="foto-miring foto-3" alt="Pic 3">
    </div>
  </div>

  <script>
    function bukaKotak() {
      const box = document.getElementById('gift-box');
      const section = document.getElementById('home');
      const asetCute = [
        'bunga-cute.png',  
        'kelinci-cute.png' 
      ];

      // Ledakan masif (Doppelganger)
      let jumlahPartikelMencelat = 60; 

      for(let i = 0; i < jumlahPartikelMencelat; i++) {
        let particle = document.createElement('img');
        particle.src = asetCute[i % 2];
        particle.className = 'particle';
        
        let tx = (Math.random() - 0.5) * 600 + 'px';
        let ty = (Math.random() - 0.5) * 600 - 200 + 'px';
        let rot = Math.random() * 720 + 'deg';
        
        particle.style.setProperty('--tx', tx);
        particle.style.setProperty('--ty', ty);
        particle.style.setProperty('--rot', rot);
        
        let scaleVariation = 1 + (Math.random() - 0.5) * 0.5;
        particle.style.transform = `scale(${scaleVariation})`;
        
        particle.style.left = box.offsetLeft + (box.offsetWidth/2) - 30 + 'px';
        particle.style.top = box.offsetTop + (box.offsetHeight/2) - 30 + 'px';
        
        section.appendChild(particle);
        
        setTimeout(() => {
          particle.remove();
        }, 1500);
      }

      setTimeout(() => {
        window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
      }, 1000);
    }
  </script>
</body>
</html>
